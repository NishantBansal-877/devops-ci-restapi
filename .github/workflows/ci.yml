name: Node.js CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test - Node ${{ matrix.node-version }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

  security:
    name: Dependency Security Audit

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  docker:
    name: Docker Build and Smoke Test

    needs:
      - test
      - security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t devops-node-ci:${{ github.sha }} \
            .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name devops-node-ci \
            --publish 3000:3000 \
            --env APP_VERSION=${{ github.sha }} \
            devops-node-ci:${{ github.sha }}

      - name: Smoke test
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-all-errors \
            http://localhost:3000/health

      - name: Show container logs
        if: always()
        run: docker logs devops-node-ci || true

      - name: Remove container
        if: always()
        run: docker rm --force devops-node-ci || true
